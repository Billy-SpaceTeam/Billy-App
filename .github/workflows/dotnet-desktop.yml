name: Build & Release Billy-App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet Packages
      run: nuget restore Billy-App/Billy-App.csproj -PackagesDirectory packages

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build WinForms App
      run: msbuild Billy-App/Billy-App.csproj /p:Configuration=Release /p:OutputPath=../publish

    - name: Zip Build Output
      run: |
        Compress-Archive -Path ./publish/* -DestinationPath ./Billy-App-Release.zip

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Billy-App-Release
        path: Billy-App-Release.zip
