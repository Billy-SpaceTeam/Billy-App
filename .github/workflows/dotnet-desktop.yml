name: Build & Release Billy-App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Publish WinForms App
      run: dotnet publish Billy-App/Billy-App.csproj -c Release -r win-x64 --self-contained false -o ./publish

    - name: Zip Build Output
      run: Compress-Archive -Path ./publish/* -DestinationPath ./Billy-App.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: Billy-App.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
